<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página Inicial</title>
    <style>
        body {
            background-color: #13161F;
            color: white;
            font-family: Arial, sans-serif; 
            display: flex;
            height: 100vh;
            margin: 0;
        }
        nav {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
            justify-content: flex-start;
            width: 200px;
            min-height: 100vh;
            background-color: #1C1F28;
            padding: 20px;
            box-sizing: border-box;
            padding-top: 10vh;
        }
        nav a{
            color: #565962;
            padding: 12px;
            text-decoration: none;
            background-color: #1C1F28;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
        }
        nav a:hover{
            background-color:#2d303b;
            color: white;
        }main{
            flex:1;
            min-width: 0;
        }
        h1{
            color: white;
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
        }
        h2{
            color: white;
            font-size: 21px;
            text-align: center;
            margin-top: 35px;
        }
        span{
            color: red;
            font-weight: bold;
        }
        .card {
            width: 650px;
            height: 235px;
            background-color: #64DB66;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            position: relative;
            margin: 25px auto 0;

        }
        .card h2{
            position: absolute;
            top: 20px;
            left: 20px;
            margin: 0;
        }
        .valor {
            font-size: 45px;
            font-weight: bold;
            color: black;
            transform: translateY(60px);
        }
        .card .uid {
            position: absolute;
            bottom: 15px;
            left: 20px;
            margin: 0;
            color: black;
            font-size: 21px;
        }
        .card .data {
            position: absolute;
            bottom: 15px;
            right: 20px;
            margin: 0;
            color: black;
            font-size: 21px;
        }
        table{
            width: 60%;
            border-collapse: collapse;
            margin: 15px auto 0;
        }
        th,td{
            padding: 12px 16px;
            border-bottom: 1px solid #363944;
            text-align: center;
        }
        td{
            font-family: monospace;
            font-size: 16px;
        }
        th{
            color: #64DB66;
        }
        .liberado {
            color: #64DB66;
        }

        .negado {
            color: #ff5c5c;
        }
        #card-acesso{
            background-color: #fff9f9;
        }
    </style>
</head>
<body>
    <nav>
        <a href="second_page.html">🖥️ Painel</a>
        <a href="historico.html">🕒 Histórico</a>
        <a href="controle.html">🔒 Controle</a>
    </nav>
    <main>
            <h1>Painel de Monitoramento</h1>
            <h2>Status de Conexão com o Arduino:<span> Não Conectado •</span></h2>
            <div class="card" id="card-acesso">
                <span class="valor" id="status-acesso">ACESSO LIBERADO</span>
                <p class="uid" id="status-numeroslidos">UID do cartão: 57 60 AB B1</p>
                <p class="data" id="status-datahoje">2026-10-25 21:13:08</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>UID</th>
                        <th>Status</th>
                        <th>Data/Hora</th>
                    </tr>
                </thead>
                <tbody id="historico-acesso">
                    <tr>
                        <td>UID1</td>
                        <td class="negado">Negado</td>
                        <td>Data1</td>
                    </tr>
                    <tr>
                        <td>UID2</td>
                        <td class="negado">Negado</td>
                        <td>Data2</td>
                    </tr>
                    <tr>
                        <td>UID3</td>
                        <td class="liberado">Liberado</td>
                        <td>Data3</td>
                    </tr>
                    <tr>
                        <td>UID4</td>
                        <td class="negado">Negado</td>
                        <td>Data4</td>
                    </tr>
                    <tr>
                        <td>UID5</td>
                        <td class="liberado">Liberado</td>
                        <td>Data5</td>
                    </tr>
                </tbody>
            </table>
    </main>
    <script> 
        const historico = document.getElementById("historico-acesso");
        const cardAcesso = document.getElementById("card-acesso");
        const statusAcesso = document.getElementById("status-acesso");
        const statusUid = document.getElementById("status-numeroslidos");
        const statusData = document.getElementById("status-datahoje");
        let ultimaDataa = "";

        function adicionarAcesso(uid,status,data){
            const foiLiberado = status.toLowerCase() === "liberado";
            cardAcesso.style.backgroundColor = foiLiberado ? "#64DB66" : "#FF5C5C";
            statusAcesso.textContent = foiLiberado ? "ACESSO LIBERADO" : "ACESSO RECUSADO";
            statusUid.textContent = `UID do cartão: ${uid}`;
            statusData.textContent = data;
            const linhanova = document.createElement("tr");  
            linhanova.innerHTML = `
                <td>${uid}</td>
                <td class="${foiLiberado ? "liberado" : "negado"}">${foiLiberado ? "Liberado" : "Negado"}</td>
                <td>${data}</td>
            `;
            historico.prepend(linhanova);
            if (historico.children.length >5){
                historico.lastElementChild.remove()
            }
        }

        
    </script>
    
</body>
</html>
