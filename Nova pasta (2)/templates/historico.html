<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Histórico</title>
    <style>
        body{
            background-color: #13161F;
            color: white;
            font-family: Arial, sans-serif; 
            display: flex;
            height: 100vh;
            margin: 0; 
        }
        main{
            flex: 1;
            position: relative;
        }
        nav{
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
            justify-content: flex-start;
            width: 200px;
            min-height: 100vh;
            background-color:#1C1F28;
            padding: 20px;
            box-sizing: border-box;
            padding-top: 10vh;
        }
        .botao_menu{
            color: #565962;
            padding: 12px;
            text-decoration: none;
            background-color: #1C1F28;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
        }
        .botao_menu:hover{
            background-color:#2d303b;
            color: white;
        }
        h1{
            color: white;
            text-align: left;
            margin-left: 20px;
            margin-top: 20px;
            font-size: 24px;
        }
        table {
            width: 70%;
            border-collapse: collapse;
            background-color: #1F232E;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            border-radius: 15px;


        }
        th{
            padding: 10px 18px;
            text-align: left;
            color: #AAB3C5;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td {
            padding: 8px 18px;
            color: white;
            border-bottom: 1px solid #303746;
            font-size: 13px;
        }
        tbody tr:nth-child(even) {
            background-color: #1C202B;
        }
        tbody tr:hover {
            background-color: #303B4F;
            transition: 0.2s;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: #20283D;
        }
        td, th {
            border-right: 1px solid #303746;
        }
        .paginas_historico{
            position: fixed;
            padding: 20px;
            left: 38%;
            top: 86vh;
        }
        .paginas_historico button{
            background-color: #2273DD;
            border: 1px solid #303746;
            color:whitesmoke;
            border-radius: 10px;
            width: 20vh;
            height: 6vh;
            font-weight: bold;
            font-size: 14px;
            margin: 0 16px;
            cursor: pointer;
        }
        .paginas_historico button:hover{
            background-color: #16437e;
        }
        .paginas_historico button:disabled{
            background-color: #48515c;
        }
        .liberado {
            color: #64DB66;
            font-weight: bold;
        }

        .bloqueado {
            color: #ff5c5c;
            font-weight: bold;
        }
        th:nth-child(4), td:nth-child(4){
            width: 190px;
            padding: 5px;
        }
        .botaosair{
            color: #565962;
            padding: 12px;
            text-decoration: none;
            background-color: #1C1F28;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
            position: fixed;
            top: 90vh;
            width: 138px;
        }
        .botaosair:hover{
            background-color:#2d303b;
            color: white;
        }
    </style>
</head>
<body>
    <nav>
        <a class= "botao_menu" href="/second_page">🖥️ Painel</a>
        <a class= "botao_menu" href="/historico">🕒 Histórico</a>
        <a class= "botao_menu" href="/controle">🔒 Controle</a>
        <a class = "botaosair" href="/first_page">🚪 Sair</a>
    </nav>
    <main>
        <h1>Histórico de Acesso & Relatórios

        </h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>UID</th>
                    <th>STATUS</th>
                    <th>DATA / HORA</th>
                </tr>
                <tbody id = "historico-geral">

                </tbody>
            </thead>
        </table>
        <div class="paginas_historico">
            <button id = "anterior" onclick="mudarPagina(-1)">Página Anterior</button>
            <span id="pagina-atual">Página 1</span>
            <button id = "proximo" onclick="mudarPagina(1)">Próxima Página</button>
        </div>
    </main>
    <script>
        let paginaAtual = 1;
        let paginaTotal = 1;

        async function carregarHistorico() {
            const resposta = await fetch(`/api/historico?pagina=${paginaAtual}`);
            const dados = await resposta.json();
            paginaTotal = dados.total_paginas;
            const tbody = document.getElementById('historico-geral');
            tbody.innerHTML = '';
            dados.registros.forEach(item => {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.uid}</td>
                    <td class="${item.acesso === 'Liberado' ? 'liberado' : 'bloqueado'}">${item.acesso}</td>
                    <td>${item.data_hora}</td>`
            
                tbody.appendChild(linha)
            });
        
        document.getElementById('pagina-atual').textContent=`Página ${paginaAtual} de ${paginaTotal}`;
        document.getElementById('anterior').disabled = paginaAtual ===1;
        document.getElementById('proximo').disabled = paginaAtual === paginaTotal;
        }
        function mudarPagina(direcao) {

            const novaPagina = paginaAtual + direcao;

            if (novaPagina < 1 || novaPagina > paginaTotal) {
                return;
            }

            paginaAtual = novaPagina;

            carregarHistorico();
        }
        carregarHistorico();
        setInterval(carregarHistorico, 2000);
    </script>
</body>
</html>
