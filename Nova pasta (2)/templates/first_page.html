<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #13161F;
            font-family: Arial, sans-serif;
        }

        .login-card {
            display: flex;
            flex-direction: column;
            background-color: #313541;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            width: 350px;
            height: 500px;
            align-items: center;
            text-align: center;
            color: #ffffff;
            box-sizing: border-box;
        }

        .login-card h2 {
            margin-top: 10px;
            margin-bottom: 0;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #F19D01;
            border-radius: 12px;
            background-color: #181825;
            color: #ffffff;
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: #F19D01;
        }

        #usuario {
            margin-top: 90px;
            margin-bottom: 12px;
        }

        #senha {
            margin-bottom: 45px;
        }

        .btn-login {
            width: 280px;
            padding: 12px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #144870;
        }

        #mensagem {
            margin-top: 25px;
            font-size: 14px;
        }
        .login-card a{
            color: #565962;
            text-decoration: none;
            padding: 20px;
            background-color: #313541;
            font-size: 18px;
            font-family: 'Noto Sans', sans-serif;
        }
         a:hover{
            text-decoration: underline;
        }
        p{
            position: fixed;
            left: 43%;
            top: 65vh;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Acesso ao Sistema</h2>

        <input type="text" id="usuario" class="input-field" placeholder="Digite o ID">
        <input type="password" id="senha" class="input-field" placeholder="Digite a senha">
        <a href="visitante.html">Entrar como Convidado(a)</a>
        <button class="btn-login" onclick="validarLogin()">Entrar</button>

        <p id="mensagem"></p>   
    </div>

    <script>
    async function validarLogin() {
        var usuarioDigitado = document.getElementById("usuario").value;
        var senhaDigitada = document.getElementById("senha").value;
        var elementoMensagem = document.getElementById("mensagem");

        try {
            const resposta = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario: usuarioDigitado, senha: senhaDigitada })
            });

            if (resposta.ok) {
                const dadosSessao = await resposta.json(); // Lê o retorno do Flask
                
                elementoMensagem.style.color = "#4CAF50";
                elementoMensagem.textContent = "Login efetuado com sucesso!";
                
                setTimeout(function(){
                    // CORREÇÃO: Redireciona dependendo de quem logou
                    if (dadosSessao.papel === "admin") {
                        window.location.href = "/second_page";
                    } else {
                        window.location.href = "/second_page";
                    }
                }, 1000);
            } else {
                elementoMensagem.style.color = "#f44336";
                elementoMensagem.textContent = "Usuário ou senha incorretos!";
            }
        } catch (erro) {
            elementoMensagem.style.color = "#f44336";
            elementoMensagem.textContent = "Servidor indisponível!";
        }
    }
</script>


</body>
</html>
